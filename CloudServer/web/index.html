<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>i-NET-PROMO Cloudservice</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#f6f8fb;color:#14375b}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}aside{background:#fff;border-right:1px solid #e5eaf0;padding:28px 22px}.brand{font-size:25px;font-weight:800}.sub{font-size:12px;color:#00a9c9;font-weight:700;margin-bottom:36px}.nav button{display:block;width:100%;border:0;background:transparent;padding:13px;text-align:left;border-radius:8px;color:#14375b;font-size:14px}.nav button:first-child{background:#e8f8fb}header{height:76px;background:#fff;border-bottom:1px solid #e5eaf0;display:flex;align-items:center;padding:0 32px;justify-content:space-between}main{padding:30px}.actions{display:flex;gap:10px;margin:22px 0}.actions button,.primary{border:1px solid #dde5ec;background:#fff;padding:11px 17px;border-radius:7px;color:#14375b}.primary{background:#00a9c9!important;color:#fff!important;border:0!important}.card{background:#fff;border:1px solid #e1e7ed;border-radius:10px;padding:16px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px;border-bottom:1px solid #edf1f4}#login{max-width:480px;margin:10vh auto}.field{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #dbe3ea;border-radius:6px}</style></head><body><div id="login" class="card"><div class="brand">i-NET-PROMO</div><div class="sub">CLOUDSERVICE WEB</div><h2>Anmelden</h2><input id="u" class="field" placeholder="Benutzername"><input id="p" class="field" type="password" placeholder="Passwort"><button class="primary" onclick="login()">Anmelden</button><p id="msg"></p></div><div id="cloud" class="app" style="display:none"><aside><div class="brand">i-NET-PROMO</div><div class="sub">CLOUDSERVICE</div><div class="nav"><button>☁ Meine Cloud</button><button>▣ Persönlich</button><button>▤ Projekte</button><button>↗ Mit mir geteilt</button><button onclick="createTransfer()">⇄ Transfer</button></div></aside><section><header><b>Meine Cloud</b><span>Webclient</span></header><main><h1>Meine Cloud</h1><div class="actions"><button class="primary" onclick="newFolder()">＋ Neuer Ordner</button><button onclick="pickUpload()">↑ Hochladen</button><button onclick="shareSelected()">↗ Freigeben</button><button onclick="renameSelected()">✎ Umbenennen</button><button onclick="deleteSelected()">Löschen</button><button onclick="showShares()">Mit mir geteilt</button><input id="file" type="file" hidden onchange="upload(this.files[0])"><button>⇄ Transfer</button></div><div class="card"><table><thead><tr><th>Name</th><th>Typ/Bereich</th><th>Größe/Rechte</th></tr></thead><tbody id="rows"></tbody></table></div></main></section></div><script>let token='',storage=null,path='',selected=null;const H=()=>({Authorization:'Bearer '+token});async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({userName:u.value,password:p.value})});if(!r.ok){msg.textContent='Anmeldung fehlgeschlagen';return}let j=await r.json();token=j.token;login.style.display='none';cloud.style.display='grid';await load()}async function load(){let r=await fetch('/api/storage',{headers:H()}),a=await r.json();storage=a[0];if(storage)await files()}async function files(){let r=await fetch('/api/files?storageId='+encodeURIComponent(storage.id)+'&path='+encodeURIComponent(path),{headers:H()}),a=await r.json();rows.innerHTML=a.map(x=>'<tr ondblclick="openItem(\''+encodeURIComponent(x.name)+'\','+x.isDirectory+')"><td>'+esc(x.name)+'</td><td>'+(x.isDirectory?'Ordner':esc(storage.role))+'</td><td>'+(x.isDirectory?'—':size(x.size))+'</td></tr>').join('')}function selectItem(n,d,tr){selected={name:decodeURIComponent(n),isDirectory:d};document.querySelectorAll('#rows tr').forEach(x=>x.style.background='');tr.style.background='#e8f8fb'}async function renameSelected(){if(!selected||!storage)return alert('Bitte Datei oder Ordner auswählen.');let n=prompt('Neuer Name',selected.name);if(!n||n==selected.name)return;let rel=path?path+'/'+selected.name:selected.name;let r=await fetch('/api/rename',{method:'POST',headers:{...H(),'content-type':'application/json'},body:JSON.stringify({storageId:storage.id,path:rel,newName:n})});if(!r.ok)return alert('Umbenennen fehlgeschlagen.');selected=null;await files()}async function deleteSelected(){if(!selected||!storage)return alert('Bitte Datei oder Ordner auswählen.');if(!confirm('„'+selected.name+'“ wirklich löschen?'))return;let rel=path?path+'/'+selected.name:selected.name;let r=await fetch('/api/delete',{method:'POST',headers:{...H(),'content-type':'application/json'},body:JSON.stringify({storageId:storage.id,path:rel})});if(!r.ok)return alert('Löschen fehlgeschlagen.');selected=null;await files()}async function createTransfer(){if(!selected||!storage)return alert('Bitte Datei oder Ordner auswählen.');let password=prompt('Passwort (optional)','')||'';let days=Number(prompt('Gültig für Tage (0 = unbegrenzt)','7')||0);let allowUpload=confirm('Upload über den Transferlink erlauben?');let del=Number(prompt('Automatisch löschen nach Tagen (0, 7, 14 oder 30)','0')||0);let rel=path?path+'/'+selected.name:selected.name;let r=await fetch('/api/transfers',{method:'POST',headers:{...H(),'content-type':'application/json'},body:JSON.stringify({storageId:storage.id,relativePath:rel,password,expiresUtc:days>0?new Date(Date.now()+days*86400000).toISOString():null,allowDownload:true,allowUpload,autoDeleteDays:del})});if(!r.ok)return alert('Transferlink konnte nicht erstellt werden.');let t=await r.json();let link=location.origin+'/transfer/'+t.token;try{await navigator.clipboard.writeText(link)}catch{}prompt('Transferlink (wurde nach Möglichkeit kopiert):',link)}async function shareSelected(){if(!selected||!storage)return alert('Bitte Datei oder Ordner auswählen.');let ur=await fetch('/api/share-users',{headers:H()}),users=await ur.json();if(!users.length)return alert('Keine anderen Benutzer verfügbar.');let names=users.map((x,i)=>(i+1)+': '+(x.displayName||x.userName)+' ('+x.userName+')').join('\n');let pick=prompt('Benutzer auswählen:\n'+names,'1');let u=users[Number(pick)-1];if(!u)return;let canWrite=confirm('Lesen & Schreiben erlauben?\nOK = Lesen & Schreiben, Abbrechen = Nur Lesen');let rel=path?path+'/'+selected.name:selected.name;let r=await fetch('/api/shares',{method:'POST',headers:{...H(),'content-type':'application/json'},body:JSON.stringify({ownerUserId:'',targetUserId:u.id,storageId:storage.id,relativePath:rel,canWrite})});alert(r.ok?'Freigabe erstellt.':'Freigabe fehlgeschlagen.')}async function openItem(n,d){n=decodeURIComponent(n);if(d){path=path?path+'/'+n:n;await files();return}location.href='/api/download?storageId='+encodeURIComponent(storage.id)+'&path='+encodeURIComponent(path?path+'/'+n:n)+'&access_token='+encodeURIComponent(token)}async function newFolder(){let n=prompt('Name des neuen Ordners');if(!n)return;await fetch('/api/folders',{method:'POST',headers:{...H(),'content-type':'application/json'},body:JSON.stringify({storageId:storage.id,path,name:n})});await files()}function pickUpload(){file.click()}async function upload(f){if(!f)return;await fetch('/api/upload?storageId='+encodeURIComponent(storage.id)+'&path='+encodeURIComponent(path)+'&name='+encodeURIComponent(f.name),{method:'POST',headers:H(),body:f});await files()}async function showShares(){let r=await fetch('/api/shares/received',{headers:H()}),a=await r.json();rows.innerHTML=a.map(x=>'<tr><td>'+esc(x.relativePath)+'</td><td>'+esc(x.owner)+'</td><td>'+(x.canWrite?'Lesen & Schreiben':'Nur Lesen')+'</td></tr>').join('')}function size(n){return n>1073741824?(n/1073741824).toFixed(2)+' GB':n>1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB'}function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}</script></body></html>
