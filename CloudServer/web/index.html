<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>i-NET-PROMO Cloudservice</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#f6f8fb;color:#14375b}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}aside{background:#fff;border-right:1px solid #e5eaf0;padding:28px 22px}.brand{font-size:25px;font-weight:800}.sub{font-size:12px;color:#00a9c9;font-weight:700;margin-bottom:36px}.nav button{display:block;width:100%;border:0;background:transparent;padding:13px;text-align:left;border-radius:8px;color:#14375b;font-size:14px}.nav button:first-child{background:#e8f8fb}header{height:76px;background:#fff;border-bottom:1px solid #e5eaf0;display:flex;align-items:center;padding:0 32px;justify-content:space-between}main{padding:30px}.actions{display:flex;gap:10px;margin:22px 0}.actions button,.primary{border:1px solid #dde5ec;background:#fff;padding:11px 17px;border-radius:7px;color:#14375b}.primary{background:#00a9c9!important;color:#fff!important;border:0!important}.card{background:#fff;border:1px solid #e1e7ed;border-radius:10px;padding:16px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px;border-bottom:1px solid #edf1f4}#login{max-width:480px;margin:10vh auto}.field{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #dbe3ea;border-radius:6px}</style></head><body><div id="login" class="card"><div class="brand">i-NET-PROMO</div><div class="sub">CLOUDSERVICE WEB</div><h2>Anmelden</h2><input id="u" class="field" placeholder="Benutzername"><input id="p" class="field" type="password" placeholder="Passwort"><button class="primary" onclick="login()">Anmelden</button><p id="msg"></p></div><div id="cloud" class="app" style="display:none"><aside><div class="brand">i-NET-PROMO</div><div class="sub">CLOUDSERVICE</div><div class="nav"><button>☁ Meine Cloud</button><button>▣ Persönlich</button><button>▤ Projekte</button><button>↗ Mit mir geteilt</button><button>⇄ Transfer</button></div></aside><section><header><b>Meine Cloud</b><span>Webclient</span></header><main><h1>Meine Cloud</h1><div class="actions"><button class="primary">＋ Neuer Ordner</button><button>↑ Hochladen</button><button>↗ Freigeben</button><button>⇄ Transfer</button></div><div class="card"><table><thead><tr><th>Name</th><th>Bereich</th><th>Kapazität</th></tr></thead><tbody id="rows"></tbody></table></div></main></section></div><script>async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({userName:u.value,password:p.value})});if(!r.ok){msg.textContent='Anmeldung fehlgeschlagen';return}login.style.display='none';cloud.style.display='grid';load()}async function load(){let a=await(await fetch('/api/storage')).json();rows.innerHTML=a.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.role)+'</td><td>'+(x.quotaBytes<=0?'Unbegrenzt':Math.round(x.quotaBytes/1073741824)+' GB')+'</td></tr>').join('')}function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}</script></body></html>
