<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>i-NET-PROMO Cloudservice</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#f6f8fb;color:#14375b}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}aside{background:#fff;border-right:1px solid #e5eaf0;padding:28px 22px}.brand{font-size:25px;font-weight:800}.sub{font-size:12px;color:#00a9c9;font-weight:700;margin-bottom:36px}.nav button{display:block;width:100%;border:0;background:transparent;padding:13px;text-align:left;border-radius:8px;color:#14375b;font-size:14px}.nav button:first-child{background:#e8f8fb}header{height:76px;background:#fff;border-bottom:1px solid #e5eaf0;display:flex;align-items:center;padding:0 32px;justify-content:space-between}main{padding:30px}.actions{display:flex;gap:10px;margin:22px 0}.actions button,.primary{border:1px solid #dde5ec;background:#fff;padding:11px 17px;border-radius:7px;color:#14375b}.primary{background:#00a9c9!important;color:#fff!important;border:0!important}.card{background:#fff;border:1px solid #e1e7ed;border-radius:10px;padding:16px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px;border-bottom:1px solid #edf1f4}#login{max-width:480px;margin:10vh auto}.field{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #dbe3ea;border-radius:6px}</style></head><body><div id="login" class="card"><img src="/brand-logo" style="max-width:190px;max-height:80px;object-fit:contain"><div class="sub">CLOUDSERVICE WEB</div><h2>Anmelden</h2><input id="u" class="field" placeholder="Benutzername"><input id="p" class="field" type="password" placeholder="Passwort"><button class="primary" onclick="login()">Anmelden</button><p id="msg"></p></div><div id="cloud" class="app" style="display:none"><aside><img src="/brand-logo" style="max-width:190px;max-height:80px;object-fit:contain"><div class="sub">CLOUDSERVICE</div><div class="nav"><button>☁ Meine Cloud</button><button>▣ Persönlich</button><button>▤ Projekte</button><button>↗ Mit mir geteilt</button><button onclick="createTransfer()">⇄ Transfer</button></div></aside><section><header><b>Meine Cloud</b><span>Webclient</span></header><main><h1>Meine Cloud</h1><div class="actions"><button class="primary" onclick="newFolder()">＋ Neuer Ordner</button><button onclick="pickUpload()">↑ Hochladen</button><button onclick="shareSelected()">↗ Freigeben</button><button onclick="renameSelected()">✎ Umbenennen</button><button onclick="deleteSelected()">Löschen</button><button onclick="showShares()">Mit mir geteilt</button><button onclick="showMyShares()">Meine Freigaben</button><button onclick="showTransfers()">Transfer</button><input id="file" type="file" hidden onchange="upload(this.files[0])"><button>⇄ Transfer</button></div><div class="card"><table><thead><tr><th>Name</th><th>Typ/Bereich</th><th>Größe/Rechte</th></tr></thead><tbody id="rows"></tbody></table></div></main></section></div><script>let token='',storage=null,path='',selected=null,sharedMode=false,sharedRoot='',sharedStorageId='',sharedCanWrite=false;async function api(url,opt={}){opt.headers={...(opt.headers||{}),...H()};let r=await fetch(url,opt);if(r.status===401){token='';alert('Ihre Sitzung ist abgelaufen. Bitte melden Sie sich erneut an.');location.reload();throw new Error('Sitzung abgelaufen')}return r}async function logout(){try{await fetch('/api/logout',{method:'POST',headers:H()})}catch{}token='';location.reload()}const H=()=>({Authorization:'Bearer '+token});async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({userName:u.value,password:p.value})});if(!r.ok){msg.textContent='Anmeldung fehlgeschlagen';return}let j=await r.json();token=j.token;login.style.display='none';cloud.style.display='grid';await load()}async function load(){sharedMode=false;sharedRoot='';sharedStorageId='';let r=await api('/api/storage',{headers:H()}),a=await r.json();storage=a[0];if(storage)await files()}async function files(){selected=null;let sid=storage?.id;if(!sid)return;let r=await api('/api/files?storageId='+encodeURIComponent(sid)+'&path='+encodeURIComponent(path),{headers:H()}),a=await r.json();rows.innerHTML=a.map(x=>'<tr onclick="selectItem(\''+encodeURIComponent(x.name)+'\','+x.isDirectory+',this)" ondblclick="openItem(\''+encodeURIComponent(x.name)+'\','+x.isDirectory+')"><td>'+esc(x.name)+'</td><td>'+(x.isDirectory?'Ordner':esc(storage.role))+'</td><td>'+(x.isDirectory?'—':size(x.size))+'</td></tr>').join('')}function selectItem(n,d,tr){selected={name:decodeURIComponent(n),isDirectory:d};document.querySelectorAll('#rows tr').forEach(x=>x.style.background='');tr.style.background='#e8f8fb'}async function renameSelected(){if(!selected)return alert('Bitte Datei oder Ordner auswählen.');if(sharedMode&&!sharedCanWrite)return alert('Diese Freigabe ist nur lesbar.');let sid=sharedMode?sharedStorageId:storage?.id;if(!sid)return;let n=prompt('Neuer Name',selected.name);if(!n||n==selected.name)return;let rel=path?path+'/'+selected.name:selected.name;let r=await api('/api/rename',{method:'POST',headers:{...H(),'content-type':'application/json'},body:JSON.stringify({storageId:sid,path:rel,newName:n})});if(!r.ok)return alert('Umbenennen fehlgeschlagen.');selected=null;await (sharedMode?sharedFiles():files())}async function deleteSelected(){if(!selected)return alert('Bitte Datei oder Ordner auswählen.');if(sharedMode&&!sharedCanWrite)return alert('Diese Freigabe ist nur lesbar.');let sid=sharedMode?sharedStorageId:storage?.id;if(!sid)return;if(!confirm('„'+selected.name+'“ wirklich löschen?'))return;let rel=path?path+'/'+selected.name:selected.name;let r=await api('/api/delete',{method:'POST',headers:{...H(),'content-type':'application/json'},body:JSON.stringify({storageId:sid,path:rel})});if(!r.ok)return alert('Löschen fehlgeschlagen.');selected=null;await (sharedMode?sharedFiles():files())}async function createTransfer(){if(sharedMode)return alert('Transferlinks können nur für eigene Dateien oder Ordner erstellt werden.');if(!selected||!storage)return alert('Bitte Datei oder Ordner auswählen.');let password=prompt('Passwort (optional)','')||'';let days=Number(prompt('Gültig für Tage (0 = unbegrenzt)','7')||0);let allowUpload=confirm('Upload über den Transferlink erlauben?');let del=Number(prompt('Automatisch löschen nach Tagen (0, 7, 14 oder 30)','0')||0);let rel=path?path+'/'+selected.name:selected.name;let r=await api('/api/transfers',{method:'POST',headers:{...H(),'content-type':'application/json'},body:JSON.stringify({storageId:storage.id,relativePath:rel,password,expiresUtc:days>0?new Date(Date.now()+days*86400000).toISOString():null,allowDownload:true,allowUpload,autoDeleteDays:del})});if(!r.ok)return alert('Transferlink konnte nicht erstellt werden.');let t=await r.json();let link=location.origin+'/transfer/'+t.token;try{await navigator.clipboard.writeText(link)}catch{}prompt('Transferlink (wurde nach Möglichkeit kopiert):',link)}async function shareSelected(){if(sharedMode)return alert('Bereits freigegebene Inhalte können hier nicht erneut freigegeben werden.');if(!selected||!storage)return alert('Bitte Datei oder Ordner auswählen.');let ur=await api('/api/share-users',{headers:H()}),data=await ur.json();let targets=[...(data.users||[]).map(x=>({id:x.id,name:'Benutzer: '+(x.displayName||x.userName)+' ('+x.userName+')',group:false})),...(data.groups||[]).map(x=>({id:x.id,name:'Gruppe: '+x.name,group:true}))];if(!targets.length)return alert('Keine Benutzer oder Gruppen verfügbar.');let names=targets.map((x,i)=>(i+1)+': '+x.name).join('\n');let pick=prompt('Benutzer oder Gruppe auswählen:\n'+names,'1');let t=targets[Number(pick)-1];if(!t)return;let canWrite=confirm('Lesen & Schreiben erlauben?\nOK = Lesen & Schreiben, Abbrechen = Nur Lesen');let rel=path?path+'/'+selected.name:selected.name;let r=await api('/api/shares',{method:'POST',headers:{...H(),'content-type':'application/json'},body:JSON.stringify({ownerUserId:'',targetUserId:t.group?null:t.id,targetGroupId:t.group?t.id:null,storageId:storage.id,relativePath:rel,canWrite})});alert(r.ok?'Freigabe erstellt.':'Freigabe fehlgeschlagen.')}async function openItem(n,d){n=decodeURIComponent(n);if(d){path=path?path+'/'+n:n;await files();return}let r=await api('/api/download?storageId='+encodeURIComponent(storage.id)+'&path='+encodeURIComponent(path?path+'/'+n:n),{headers:H()});if(!r.ok){alert('Download fehlgeschlagen');return}let b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function newFolder(){if(sharedMode&&!sharedCanWrite)return alert('Diese Freigabe ist nur lesbar.');let sid=sharedMode?sharedStorageId:storage?.id;if(!sid)return;let n=prompt('Name des neuen Ordners');if(!n)return;await api('/api/folders',{method:'POST',headers:{...H(),'content-type':'application/json'},body:JSON.stringify({storageId:sid,path,name:n})});await (sharedMode?sharedFiles():files())}function pickUpload(){file.click()}async function upload(f){if(!f)return;if(sharedMode&&!sharedCanWrite)return alert('Diese Freigabe ist nur lesbar.');let sid=sharedMode?sharedStorageId:storage?.id;if(!sid)return;let start=await api('/api/upload-session',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({storageId:sid,path:path,name:f.name,size:f.size})});if(!start.ok)return alert('Upload konnte nicht gestartet werden.');let s=await start.json(),offset=s.offset||0,chunk=4*1024*1024;while(offset<f.size){let end=Math.min(offset+chunk,f.size),part=f.slice(offset,end),r=await api('/api/upload-session/chunk?id='+encodeURIComponent(s.id)+'&offset='+offset,{method:'POST',headers:H(),body:part});if(!r.ok){let recovered=false;if(r.status===409){try{let p=await r.json();if(Number.isFinite(p.offset)&&p.offset>=0&&p.offset<=f.size){offset=p.offset;recovered=true}}catch{}}if(!recovered){let q=await api('/api/upload-session/status?id='+encodeURIComponent(s.id),{headers:H()});if(q.ok){let p=await q.json();if(Number.isFinite(p.offset)&&p.offset>=0&&p.offset<=f.size){offset=p.offset;recovered=true}}}if(recovered)continue;return alert('Upload unterbrochen. Die Sitzung bleibt für eine Wiederaufnahme erhalten.')}let p=await r.json();offset=p.offset;let pct=Math.min(100,Math.floor(offset*100/Math.max(1,f.size)));status.textContent='Upload '+pct+' %';}let done=await api('/api/upload-session/complete?id='+encodeURIComponent(s.id),{method:'POST',headers:H()});status.textContent='';if(!done.ok)return alert('Upload konnte nicht abgeschlossen werden.');await (sharedMode?sharedFiles():files())}async function showShares(){selected=null;sharedMode=true;sharedCanWrite=false;path='';sharedRoot='';sharedStorageId='';let r=await api('/api/shares/received',{headers:H()}),a=await r.json();rows.innerHTML=a.map(x=>'<tr ondblclick="openShare(\''+encodeURIComponent(x.storageId)+'\',\''+encodeURIComponent(x.relativePath||'')+'\','+x.isDirectory+','+x.canWrite+')"><td>'+esc(x.relativePath||'Freigegebener Speicher')+'</td><td>'+esc(x.owner)+'</td><td>'+(x.canWrite?'Lesen & Schreiben':'Nur Lesen')+'</td></tr>').join('')}async function openShare(sid,rel,isDir,canWrite=false){sid=decodeURIComponent(sid);rel=decodeURIComponent(rel);if(!isDir){let r=await api('/api/download?storageId='+encodeURIComponent(sid)+'&path='+encodeURIComponent(rel),{headers:H()});if(!r.ok)return alert('Download fehlgeschlagen');let b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(rel.split(/[\\/]/).pop()||'download');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}sharedMode=true;sharedCanWrite=canWrite;sharedStorageId=sid;sharedRoot=rel;path=rel;await sharedFiles()}async function sharedFiles(){selected=null;let r=await api('/api/files?storageId='+encodeURIComponent(sharedStorageId)+'&path='+encodeURIComponent(path),{headers:H()}),a=await r.json();rows.innerHTML=a.map(x=>'<tr onclick="selectItem(\''+encodeURIComponent(x.name)+'\','+x.isDirectory+',this)" ondblclick="openSharedItem(\''+encodeURIComponent(x.name)+'\','+x.isDirectory+')"><td>'+esc(x.name)+'</td><td>'+(x.isDirectory?'Ordner':'Freigegeben')+'</td><td>'+(x.isDirectory?'—':size(x.size))+'</td></tr>').join('')}async function back(){selected=null;if(sharedMode){if(!sharedRoot||path===sharedRoot){await showShares();return}let p=path.replace(/\\/g,'/').split('/');p.pop();path=p.join('/');if(path.length<sharedRoot.replace(/\\/g,'/').length)path=sharedRoot;await sharedFiles();return}if(!path)return;let p=path.replace(/\\/g,'/').split('/');p.pop();path=p.join('/');await files()}async function openSharedItem(n,d){n=decodeURIComponent(n);let rel=path?path+'/'+n:n;if(d){path=rel;await sharedFiles();return}await openShare(sharedStorageId,rel,false)}async function showMyShares(){selected=null;sharedMode=false;let r=await api('/api/shares',{headers:H()}),a=await r.json();rows.innerHTML=a.map(x=>'<tr><td>'+esc(x.relativePath||'Freigegebener Speicher')+'</td><td>'+esc(x.targetName||'')+'</td><td>'+(x.canWrite?'Lesen & Schreiben':'Nur Lesen')+' <button onclick="event.stopPropagation();toggleMyShare(\''+x.id+'\','+(!x.canWrite)+')">Recht ändern</button> <button onclick="event.stopPropagation();revokeMyShare(\''+x.id+'\')">Widerrufen</button></td></tr>').join('')}async function toggleMyShare(id,canWrite){let r=await api('/api/shares',{method:'PUT',headers:{...H(),'content-type':'application/json'},body:JSON.stringify({id,canWrite})});if(!r.ok)return alert('Freigaberecht konnte nicht geändert werden.');await showMyShares()}async function revokeMyShare(id){if(!confirm('Diese Freigabe wirklich widerrufen?'))return;let r=await api('/api/shares?id='+encodeURIComponent(id),{method:'DELETE',headers:H()});if(!r.ok)return alert('Freigabe konnte nicht widerrufen werden.');await showMyShares()}async function showTransfers(){selected=null;sharedMode=false;let r=await api('/api/transfers'),a=await r.json();window.__transferUrls={};a.forEach(x=>window.__transferUrls[x.token]=x.url);rows.innerHTML=a.map(x=>'<tr><td>'+esc(x.relativePath||'Transfer-Speicher')+'</td><td>'+esc(x.expiresUtc?new Date(x.expiresUtc).toLocaleString():'Kein Ablauf')+'</td><td>'+(x.allowDownload?'Download ':'')+(x.allowUpload?'Upload ':'')+(x.hasPassword?'• Passwort ':'')+'<button onclick="event.stopPropagation();copyTransfer(\''+x.token+'\')">Link kopieren</button> <button onclick="event.stopPropagation();revokeTransfer(\''+x.id+'\')">Widerrufen</button></td></tr>').join('')}async function copyTransfer(token){let link=(window.__transferUrls&&window.__transferUrls[token])||location.origin+'/transfer/'+token;try{await navigator.clipboard.writeText(link);alert('Transferlink kopiert.')}catch{prompt('Transferlink kopieren:',link)}}async function revokeTransfer(id){if(!confirm('Diesen Transferlink wirklich widerrufen?'))return;let r=await api('/api/transfers?id='+encodeURIComponent(id),{method:'DELETE',headers:H()});if(!r.ok)return alert('Transferlink konnte nicht widerrufen werden.');await showTransfers()}function size(n){return n>1073741824?(n/1073741824).toFixed(2)+' GB':n>1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB'}function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}</script><button onclick="logout()" style="position:fixed;right:24px;top:20px">Abmelden</button></body></html>
